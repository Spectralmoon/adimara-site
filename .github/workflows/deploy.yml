# Deploy Adimara snap-site to GitHub Pages on every push to main.
#
# Workflow:
#   1. Checkout the repo
#   2. Set up Node.js + cache npm deps
#   3. Run `npm ci && npm run build` — Vite produces dist/
#   4. Upload dist/ as the Pages artifact
#   5. Deploy to GitHub Pages (custom domain: adimara.spectralmoonstudio.com)
#
# After first successful run, the site is live at:
#   https://adimara.spectralmoonstudio.com
# (provided the GoDaddy DNS CNAME record is set: adimara → Spectralmoon.github.io)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:    # allows manual trigger from the Actions tab

# Permissions required by the GitHub-managed deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
